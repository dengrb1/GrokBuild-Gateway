[package]
name = "gbg-desktop-compat"
version = "1.1.0"
description = "GrokBuild Gateway tray shell without WebView2 (Win7+ / no Edge runtime)"
authors = ["GrokBuild-Gateway"]
edition = "2021"
# Soft floor: older toolchains may still build if deps allow
rust-version = "1.70"

[build-dependencies]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
parking_lot = "0.12"
open = "5"
tray-icon = "0.19"
muda = "0.15"
# Message pump only — no webview. tao still targets Win7-class Win32 APIs.
tao = "0.30"
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
